# dev 환경: SPRING_PROFILES_ACTIVE=prod -> application-prod.yaml(H2)을 읽도록 설정
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk226-webserver-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: webserver-backend
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          # dev/prod overlay에서 만드는 ConfigMap(sk226-backend-configmap)을 마운트한다.
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: sk226-backend-configmap
